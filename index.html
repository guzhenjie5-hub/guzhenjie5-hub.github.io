<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>田园小农夫</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(to bottom, #87CEEB, #98FB98);
            color: #333;
        }
        
        .game-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        
        h1 {
            text-align: center;
            color: #2E8B57;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            background: #F0F8FF;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2E8B57;
        }
        
        .farmland {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        
        .plot {
            height: 100px;
            background: #DEB887;
            border: 2px solid #8B4513;
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .plot:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .plot.occupied {
            background: #90EE90;
        }
        
        .crop {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .crop-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: #32CD32;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .crop-btn:hover {
            background: #228B22;
            transform: translateY(-2px);
        }
        
        .crop-btn:disabled {
            background: #CCCCCC;
            cursor: not-allowed;
            transform: none;
        }
        
        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        
        .action-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: #4169E1;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .action-btn:hover:not(:disabled) {
            background: #1E90FF;
            transform: translateY(-2px);
        }
        
        .action-btn:disabled {
            background: #CCCCCC;
            cursor: not-allowed;
            transform: none;
        }
        
        .farmer-character {
            text-align: center;
            margin: 20px 0;
            font-size: 60px;
        }
        
        .log {
            background: #F5F5F5;
            padding: 15px;
            border-radius: 10px;
            height: 100px;
            overflow-y: auto;
            margin-top: 20px;
        }
        
        .log p {
            margin: 5px 0;
            font-size: 14px;
            color: #666;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #E0E0E0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .progress {
            height: 100%;
            background: #32CD32;
            transition: width 0.3s;
        }
        
        @keyframes grow {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .growing {
            animation: grow 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🌾 田园小农夫 🌾</h1>
        <p class="subtitle">种植三农产品，体验田园生活！</p>
        
        <div class="farmer-character">
            👨‍🌾
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div>💰 金币</div>
                <div id="money" class="stat-value">100</div>
            </div>
            <div class="stat-item">
                <div>🌱 种子</div>
                <div id="seeds" class="stat-value">10</div>
            </div>
            <div class="stat-item">
                <div>⏰ 时间</div>
                <div id="time" class="stat-value">0</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="crop-btn" onclick="selectCrop('rice')">🍚 水稻 (10金)</button>
            <button class="crop-btn" onclick="selectCrop('wheat')">🌾 小麦 (15金)</button>
            <button class="crop-btn" onclick="selectCrop('corn')">🌽 玉米 (20金)</button>
            <button class="crop-btn" onclick="selectCrop('soybean')">🌱 大豆 (25金)</button>
        </div>
        
        <div class="farmland" id="farmland">
            <!-- 农田格子将通过JavaScript生成 -->
        </div>
        
        <div class="actions">
            <button class="action-btn" onclick="harvestAll()">收割全部</button>
            <button class="action-btn" onclick="buySeeds()">购买种子</button>
            <button class="action-btn" onclick="resetGame()">重新开始</button>
        </div>
        
        <div class="log" id="log">
            <p>欢迎来到田园小农夫！开始你的农业之旅吧！</p>
        </div>
    </div>

    <script>
        // 游戏状态
        let gameState = {
            money: 100,
            seeds: 10,
            time: 0,
            selectedCrop: null,
            plots: Array(16).fill(null), // 4x4农田
            cropTypes: {
                rice: { emoji: '🍚', price: 10, sellPrice: 15, growTime: 3 },
                wheat: { emoji: '🌾', price: 15, sellPrice: 22, growTime: 5 },
                corn: { emoji: '🌽', price: 20, sellPrice: 30, growTime: 7 },
                soybean: { emoji: '🌱', price: 25, sellPrice: 35, growTime: 10 }
            }
        };

        // 初始化游戏
        function initGame() {
            updateStats();
            renderFarmland();
            startGameLoop();
        }

        // 更新统计数据
        function updateStats() {
            document.getElementById('money').textContent = gameState.money;
            document.getElementById('seeds').textContent = gameState.seeds;
            document.getElementById('time').textContent = gameState.time;
            
            // 更新作物按钮状态
            for (let crop in gameState.cropTypes) {
                const btn = document.querySelector(`[onclick="selectCrop('${crop}')"]`);
                if (btn) {
                    btn.disabled = gameState.money < gameState.cropTypes[crop].price;
                }
            }
        }

        // 渲染农田
        function renderFarmland() {
            const farmland = document.getElementById('farmland');
            farmland.innerHTML = '';
            
            for (let i = 0; i < 16; i++) {
                const plot = document.createElement('div');
                plot.className = 'plot';
                plot.dataset.index = i;
                
                if (gameState.plots[i]) {
                    plot.classList.add('occupied');
                    const cropInfo = gameState.plots[i];
                    const cropDiv = document.createElement('div');
                    cropDiv.className = 'crop growing';
                    
                    if (cropInfo.stage === 'seed') {
                        cropDiv.textContent = '🌱';
                    } else if (cropInfo.stage === 'growing') {
                        cropDiv.innerHTML = `
                            <div>${gameState.cropTypes[cropInfo.type].emoji}</div>
                            <div class="progress-bar">
                                <div class="progress" style="width: ${(cropInfo.progress / cropInfo.totalTime) * 100}%"></div>
                            </div>
                        `;
                    } else if (cropInfo.stage === 'ready') {
                        cropDiv.textContent = gameState.cropTypes[cropInfo.type].emoji;
                    }
                    
                    plot.appendChild(cropDiv);
                }
                
                plot.addEventListener('click', () => plantCrop(i));
                farmland.appendChild(plot);
            }
        }

        // 选择作物
        function selectCrop(cropType) {
            if (gameState.money >= gameState.cropTypes[cropType].price) {
                gameState.selectedCrop = cropType;
                addLog(`选择了 ${getEmojiByCropType(cropType)} ${cropType}`);
            }
        }

        // 种植作物
        function plantCrop(index) {
            if (!gameState.selectedCrop) {
                addLog('请先选择要种植的作物！');
                return;
            }
            
            if (gameState.plots[index] !== null) {
                addLog('这块地已经有作物了！');
                return;
            }
            
            if (gameState.seeds <= 0) {
                addLog('种子不足！');
                return;
            }
            
            const cropType = gameState.selectedCrop;
            if (gameState.money < gameState.cropTypes[cropType].price) {
                addLog('金币不足！');
                return;
            }
            
            // 花费金币购买种子
            gameState.money -= gameState.cropTypes[cropType].price;
            gameState.seeds--;
            
            // 种植作物
            gameState.plots[index] = {
                type: cropType,
                stage: 'seed',
                progress: 0,
                totalTime: gameState.cropTypes[cropType].growTime
            };
            
            addLog(`在第${index+1}块地种下了 ${gameState.cropTypes[cropType].emoji}`);
            updateStats();
            renderFarmland();
        }

        // 收获所有成熟作物
        function harvestAll() {
            let harvested = 0;
            let earned = 0;
            
            for (let i = 0; i < gameState.plots.length; i++) {
                if (gameState.plots[i] && gameState.plots[i].stage === 'ready') {
                    const cropType = gameState.plots[i].type;
                    const sellPrice = gameState.cropTypes[cropType].sellPrice;
                    
                    gameState.money += sellPrice;
                    gameState.plots[i] = null;
                    harvested++;
                    earned += sellPrice;
                }
            }
            
            if (harvested > 0) {
                addLog(`收获了 ${harvested} 个作物，获得 ${earned} 金币！`);
                updateStats();
                renderFarmland();
            } else {
                addLog('没有成熟的作物可以收获！');
            }
        }

        // 购买种子
        function buySeeds() {
            if (gameState.money >= 5) {
                gameState.money -= 5;
                gameState.seeds += 1;
                addLog('购买了1颗种子！');
                updateStats();
            } else {
                addLog('金币不足，无法购买种子！');
            }
        }

        // 重新开始游戏
        function resetGame() {
            if (confirm('确定要重新开始吗？')) {
                gameState = {
                    money: 100,
                    seeds: 10,
                    time: 0,
                    selectedCrop: null,
                    plots: Array(16).fill(null),
                    cropTypes: gameState.cropTypes
                };
                
                addLog('游戏已重新开始！');
                updateStats();
                renderFarmland();
            }
        }

        // 游戏主循环
        function gameLoop() {
            gameState.time++;
            
            // 更新作物生长状态
            for (let i = 0; i < gameState.plots.length; i++) {
                if (gameState.plots[i] && gameState.plots[i].stage !== 'ready') {
                    gameState.plots[i].progress++;
                    
                    if (gameState.plots[i].progress >= gameState.plots[i].totalTime) {
                        gameState.plots[i].stage = 'ready';
                        addLog(`第${i+1}块地的作物已成熟！`);
                    } else if (gameState.plots[i].stage === 'seed') {
                        gameState.plots[i].stage = 'growing';
                    }
                }
            }
            
            updateStats();
            renderFarmland();
        }

        // 开始游戏循环
        function startGameLoop() {
            setInterval(gameLoop, 2000); // 每2秒更新一次
        }

        // 添加日志
        function addLog(message) {
            const log = document.getElementById('log');
            const p = document.createElement('p');
            p.textContent = `[${formatTime(gameState.time)}] ${message}`;
            log.appendChild(p);
            log.scrollTop = log.scrollHeight;
        }

        // 格式化时间
        function formatTime(time) {
            const minutes = Math.floor(time / 30);
            const seconds = time % 30;
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // 根据作物类型获取表情
        function getEmojiByCropType(type) {
            switch(type) {
                case 'rice': return '🍚';
                case 'wheat': return '🌾';
                case 'corn': return '🌽';
                case 'soybean': return '🌱';
                default: return '🌱';
            }
        }

        // 启动游戏
        window.onload = initGame;
    </script>
</body>
</html>
